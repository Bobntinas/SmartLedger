version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartledger_db
    environment:
      POSTGRES_DB: smartledger
      POSTGRES_USER: smartledger_user
      POSTGRES_PASSWORD: smartledger_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: